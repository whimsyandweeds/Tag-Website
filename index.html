<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAG — The asynchronous AI proxy that kills meetings, not momentum</title>
  <style>
    :root { --bg: #0a0612; --pink: #ff2d8a; --yellow: #ffe566; --text: #f5f0ff; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    html { scroll-snap-type: none; }
    .bg-network { position: fixed; inset: 0; z-index: -1; background: url("network-bg.webp") center / cover no-repeat; }
    .bg-network::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,6,18,0.55) 0%, rgba(10,6,18,0.22) 42%, rgba(10,6,18,0.08) 100%); }
    nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(10,6,18,0.55); backdrop-filter: blur(16px); padding: 16px; z-index: 100; }
    .logo { font-size: 1.75rem; font-weight: 900; }
    .logo span { color: var(--pink); }
    section { min-height: 100vh; padding: 120px 24px; }
    h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); }
  </style>
</head>
<body>
  <div class="bg-network"></div>
  <nav><div class="logo">TA<span>G</span></div></nav>
  <section>
    <h1>Stop forcing your brain<br>to work on somebody else's<br>schedule.</h1>
    <p>TAG is the asynchronous AI proxy that kills meetings, not momentum.</p>
  </section>
  <section id="problem"><h2>The problem</h2></section>
  <section id="how"><h2>How it works</h2></section>
  <footer style="padding:40px 24px;text-align:center;">TAG · 2026</footer>
</body>
</html>
